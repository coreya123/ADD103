<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <title>Meditation Station</title>
  </head>
  <body class="bg-body">
    <header class="container-fluid text-center mb-2">
      <h1 class="text-primary">Meditation Station</h1>
      <video
        autoplay
        muted
        loop
        poster="page_media/waves-thumbnail.webp"
        class="w-100"
      >
        <source src="page_media/waves.mp4" type="video/mp4" />
        Your browser does not support the video element.
      </video>
    </header>

    <main class="container">
      <div class="row g-2">
        <div class="col-12 col-md-6">
          <div class="card">
            <h2 class="card-header">Meditation Music</h2>
            <div class="card-body">
              <audio controls>
                <source
                  src="page_media/meditation-music.mp3"
                  type="audio/mpeg"
                />
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="card">
            <h2 class="card-header">10 Minute Guided Meditation</h2>
            <div class="card-body">
              <p>By Calm on YouTube</p>
              <div class="ratio ratio-16x9">
                <iframe
                  width="560"
                  height="315"
                  src="https://www.youtube.com/embed/ZToicYcHIOU?si=UuauoJxOeqrM4UvP"
                  title="YouTube video player"
                  frameborder="0"
                  allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share;
                  "
                  referrerpolicy="strict-origin-when-cross-origin"
                  allowfullscreen
                ></iframe>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="my-3 text-center">
      <a href="../../index.html">Back to Student Portal</a>
    </footer>
    <!-- bootstrap js -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
