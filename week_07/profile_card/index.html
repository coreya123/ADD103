<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Responsive Profile Card</title>
  </head>
  <body>
    <header>
      <h1>Profile</h1>
    </header>

    <main class="card">
      <div class="avatar">
        <img src="../images/profile-pic.jpg" alt="default profile avatar" />
      </div>

      <div class="info">
        <h2>Jane Doe</h2>
        <h3>Web Developer</h3>
        <p>
          Jane Doe is a graduate of McHenry County College. She is an expert in
          responsive web development and creates beautiful sites that look good
          on every screen size.
        </p>
      </div>
    </main>

    <footer>
      <p><a href="../../index.html">Back to Student Portal</a></p>
    </footer>
  </body>
</html>
