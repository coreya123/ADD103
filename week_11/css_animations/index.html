<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Haunted House</title>
  </head>
  <body class="background-color-change">
    <header class="container-fluid p-4">
      <div class="row justify-content-around">
        <div class="col-2 col-md-1">
          <img class="img-fluid ghost-1" src="images/ghost.svg" alt="ghost" />
        </div>
        <div class="col-2 col-md-1">
          <img class="img-fluid ghost-2" src="images/ghost.svg" alt="ghost" />
        </div>
        <h1 class="col-4 text-center text-white">Haunted House</h1>
        <div class="col-2 col-md-1">
          <img class="img-fluid ghost-3" src="images/ghost.svg" alt="ghost" />
        </div>
        <div class="col-2 col-md-1">
          <img class="img-fluid ghost-4" src="images/ghost.svg" alt="ghost" />
        </div>
      </div>
    </header>

    <main class="container">
      <div class="row justify-content-between py-3">
        <div class="col-4 col-lg-2">
          <img class="img-fluid bat-left-1" src="images/bat.svg" alt="bat" />
        </div>
        <div class="col-4 col-lg-2">
          <img class="img-fluid bat-right-1" src="images/bat.svg" alt="bat" />
        </div>
      </div>

      <div class="row justify-content-between py-3">
        <div class="col-4 col-lg-2">
          <img class="img-fluid bat-left-2" src="images/bat.svg" alt="bat" />
        </div>
        <p id="boo-text" class="col-4 col-lg-8 text-center text-white"></p>
        <div class="col-4 col-lg-2">
          <img class="img-fluid bat-right-2" src="images/bat.svg" alt="bat" />
        </div>
      </div>

      <div class="row justify-content-between py-3">
        <div class="col-4 col-lg-2">
          <img class="img-fluid bat-left-3" src="images/bat.svg" alt="bat" />
        </div>
        <div class="col-4 col-lg-8 text-center">
          <button
            id="spooky-btn"
            class="btn btn-danger btn-large btn-flicker"
            type="button"
          >
            Spooky Button
          </button>
        </div>
        <div class="col-4 col-lg-2">
          <img class="img-fluid bat-right-3" src="images/bat.svg" alt="bat" />
        </div>
      </div>
    </main>

    <footer class="text-center">
      <a class="text-white" href="../../index.html">Back to Student Portal</a>
    </footer>
    <!-- jumpscare button js -->
    <script src="jumpscare.js"></script>
  </body>
</html>
